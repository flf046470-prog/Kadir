<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="b0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6379"/><stop offset="1" stop-color="#244555"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d343e"/><stop offset="1" stop-color="#142630"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122026"/><stop offset="1" stop-color="#0a161a"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1013"/><stop offset="1" stop-color="#04070a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#ffe0ad" stop-opacity="0.92"/>
      <stop offset="0.30" stop-color="#f0ac53" stop-opacity="0.42"/>
      <stop offset="1"    stop-color="#e89a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.44" r="0.72">
      <stop offset="0.40" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.74"/>
    </radialGradient>

    <!-- tumbling silhouette, tapered limbs so it reads as a person, not a stick -->
    <g id="faller" fill="#03060a" stroke="#03060a" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="10" r="9"/>
      <polygon points="10.5,20 29.5,20 26,55 14,55"/>
      <path d="M13 24 L2 14"   fill="none" stroke-width="7.5"/>
      <path d="M2 14 L-7 2"    fill="none" stroke-width="5.5"/>
      <path d="M27 24 L39 17"  fill="none" stroke-width="7.5"/>
      <path d="M39 17 L47 6"   fill="none" stroke-width="5.5"/>
      <path d="M16 54 L7 73"   fill="none" stroke-width="9.5"/>
      <path d="M7 73 L2 88"    fill="none" stroke-width="6.5"/>
      <path d="M24 54 L34 71"  fill="none" stroke-width="9.5"/>
      <path d="M34 71 L40 85"  fill="none" stroke-width="6.5"/>
    </g>
  </defs>

  <!-- four dreams deep; the light drains downward -->
  <rect x="0" y="0"   width="512" height="132" fill="url(#b0)"/>
  <rect x="0" y="132" width="512" height="128" fill="url(#b1)"/>
  <rect x="0" y="260" width="512" height="126" fill="url(#b2)"/>
  <rect x="0" y="386" width="512" height="126" fill="url(#b3)"/>

  <g fill="#f2b45e">
    <rect x="0" y="130" width="512" height="3.5" opacity="0.85"/>
    <rect x="0" y="258" width="512" height="3"   opacity="0.55"/>
    <rect x="0" y="384" width="512" height="2.5" opacity="0.32"/>
  </g>

  <!-- something is lit far below -->
  <ellipse cx="256" cy="452" rx="176" ry="132" fill="url(#halo)"/>

  <g transform="translate(256 258) rotate(202) scale(2.55) translate(-20 -44)">
    <use href="#faller"/>
  </g>

  <rect width="512" height="512" fill="url(#vig)"/>
  <rect x="7" y="7" width="498" height="498" fill="none" stroke="#f2b45e" stroke-opacity="0.42" stroke-width="4"/>
</svg>
