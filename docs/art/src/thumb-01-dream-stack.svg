<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1b3140"/>
      <stop offset="0.55" stop-color="#0c151b"/>
      <stop offset="1" stop-color="#05080b"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b6c6d0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd08f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd08f" stop-opacity="0"/>
    </radialGradient>
    <style>.t{font-family:'Liberation Sans','DejaVu Sans',sans-serif;font-weight:700}</style>
    <g id="faller">
      <circle cx="20" cy="10" r="8.5"/>
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M20 19 L20 51" stroke-width="11"/>
        <path d="M20 27 L3 16" stroke-width="7.5"/>
        <path d="M20 27 L38 19" stroke-width="7.5"/>
        <path d="M20 50 L9 75" stroke-width="8.5"/>
        <path d="M20 50 L32 73" stroke-width="8.5"/>
      </g>
    </g>
    <g id="bed"><rect x="0" y="18" width="132" height="30" rx="5"/><rect x="0" y="0" width="16" height="48" rx="4"/></g>
    <g id="door"><rect x="0" y="0" width="50" height="100" rx="3"/></g>
    <g id="chair"><rect x="0" y="26" width="42" height="9" rx="3"/><rect x="0" y="0" width="9" height="35" rx="3"/><rect x="4" y="35" width="7" height="22"/><rect x="32" y="35" width="7" height="22"/></g>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- ================= title block ================= -->
  <text class="t" x="96" y="250" font-size="150" letter-spacing="20" fill="url(#ink)">DREAM</text>
  <g class="t" font-size="150" fill="url(#ink)">
    <text x="102" y="398">L</text><text x="212" y="410">A</text><text x="336" y="422">Y</text>
    <text x="446" y="434">E</text><text x="562" y="446">R</text><text x="684" y="458">S</text>
  </g>
  <path d="M96 512 L820 512" stroke="#f2b45e" stroke-opacity="0.5" stroke-width="3"/>
  <text class="t" x="96" y="572" font-size="42" letter-spacing="10" fill="#f2b45e">DON'T WAKE UP</text>

  <text class="t" x="96" y="700" font-size="40" fill="#cfe0e8" fill-opacity="0.92">Fail the puzzle and you don't die.</text>
  <text class="t" x="96" y="756" font-size="40" fill="#cfe0e8" fill-opacity="0.92">You fall into the dream below it.</text>
  <text class="t" x="96" y="846" font-size="31" fill="#8fa8b4" fill-opacity="0.9">The answers are always one level down.</text>
  <text class="t" x="96" y="892" font-size="31" fill="#8fa8b4" fill-opacity="0.9">Getting back up is the hard part.</text>
  <text class="t" x="96" y="990" font-size="27" letter-spacing="7" fill="#5f7480">1–6 PLAYERS   ·   CO-OP DREAM PUZZLE</text>

  <!-- ================= the stack ================= -->
  <g stroke="#000" stroke-opacity="0.5">
    <!-- depth 0 -->
    <g transform="translate(1000 110)">
      <rect width="800" height="152" fill="#1e3441" stroke="#7fa9bd" stroke-opacity="0.28" stroke-width="2"/>
      <rect y="140" width="800" height="12" fill="#0d1a20"/>
      <circle cx="150" cy="52" r="62" fill="url(#lamp)"/>
      <g fill="#0a1216"><use href="#bed" transform="translate(96 92)"/><use href="#chair" transform="translate(330 83)"/><use href="#door" transform="translate(660 40)"/></g>
    </g>
    <!-- depth 1 -->
    <g transform="translate(1000 300) rotate(-0.9)">
      <rect width="800" height="152" fill="#182a2f" stroke="#6f96a4" stroke-opacity="0.22" stroke-width="2"/>
      <rect y="140" width="800" height="12" fill="#0a1418"/>
      <circle cx="612" cy="56" r="52" fill="url(#lamp)" opacity="0.7"/>
      <g fill="#080f12"><use href="#bed" transform="translate(120 92) rotate(-2)"/><use href="#chair" transform="translate(352 83) rotate(9)"/><use href="#door" transform="translate(636 40) rotate(-3)"/></g>
    </g>
    <!-- depth 2 -->
    <g transform="translate(1000 490) rotate(-1.9)">
      <rect width="800" height="152" fill="#14211f" stroke="#5f8a7c" stroke-opacity="0.2" stroke-width="2"/>
      <rect y="140" width="800" height="12" fill="#08110f"/>
      <circle cx="352" cy="60" r="40" fill="url(#lamp)" opacity="0.45"/>
      <g fill="#060d0c">
        <use href="#bed" transform="translate(84 92) rotate(-6)"/><use href="#bed" transform="translate(250 96) rotate(4)"/>
        <use href="#chair" transform="translate(430 83) rotate(-16)"/><use href="#door" transform="translate(600 40) rotate(6)"/>
      </g>
    </g>
    <!-- depth 3 -->
    <g transform="translate(1000 680) rotate(-2.4)">
      <rect width="800" height="152" fill="#1a1a1d" stroke="#7b7b84" stroke-opacity="0.18" stroke-width="2"/>
      <rect y="140" width="800" height="12" fill="#0c0c0e"/>
      <g fill="#050506">
        <use href="#bed" transform="translate(70 92) rotate(-11)"/><use href="#bed" transform="translate(238 98) rotate(7)"/>
        <use href="#bed" transform="translate(410 90) rotate(-3)"/>
        <use href="#chair" transform="translate(560 83) rotate(24)"/><use href="#door" transform="translate(690 40) rotate(-9)"/>
      </g>
    </g>
    <!-- limbo -->
    <g transform="translate(1000 870)">
      <rect width="800" height="118" fill="#1e1e22" stroke="#9a9aa2" stroke-opacity="0.16" stroke-width="2"/>
      <rect y="106" width="800" height="12" fill="#141416"/>
      <g fill="#0d0d10" opacity="0.85"><use href="#door" transform="translate(378 8) scale(0.98)"/></g>
    </g>
  </g>

  <!-- depth labels -->
  <g class="t" font-size="34" fill="#f2b45e" text-anchor="end" letter-spacing="4">
    <text x="962" y="200">0</text><text x="962" y="390">1</text>
    <text x="962" y="580">2</text><text x="962" y="770">3</text>
  </g>
  <text class="t" x="962" y="946" font-size="27" fill="#9a9aa2" text-anchor="end" letter-spacing="4">LIMBO</text>

  <!-- fall / kick -->
  <g class="t" font-size="23" letter-spacing="4">
    <path d="M1836 272 L1836 292 M1836 300 L1836 320 M1836 328 L1836 348 M1836 356 L1836 372"
          stroke="#e07a4f" stroke-width="4" stroke-linecap="round"/>
    <path d="M1824 366 L1836 386 L1848 366" fill="none" stroke="#e07a4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1858" y="340" fill="#e07a4f" transform="rotate(90 1858 340)">FALL</text>

    <path d="M1876 646 L1876 470" stroke="#7fd0b4" stroke-width="4" stroke-linecap="round"/>
    <path d="M1864 490 L1876 468 L1888 490" fill="none" stroke="#7fd0b4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1900" y="580" fill="#7fd0b4" transform="rotate(90 1900 580)">KICK</text>
  </g>

  <!-- the faller, mid-descent -->
  <g transform="translate(1290 286) rotate(204) scale(1.95) translate(-20 -42)" color="#04070a" fill="#04070a"><use href="#faller"/></g>

  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
