name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Licence gate: fails if a pack declares no licence, is attribution-bound with no author,
      # or fetches bytes with no pinned checksum.
      - run: npm run assets:check
      # Store gate: fails on a manifest or icon that Horizon would reject.
      - run: npm run pack:quest:check
      - run: npm run pack:phone:check
      - run: npm run pack:msstore:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Packaging the Steam app also proves the built output is self-consistent — a missing
      # build step otherwise shows up as a blank window rather than an error.
      - run: npm run pack:steam
      # The web bundle is the artifact every store package wraps, so it must always be
      # collectable. The Electron and Android targets need toolchains this runner does not
      # have; they are reported as skipped rather than failing the build.
      - run: npm run pack:release -- --require web

  # The other storage tests use a stub client, which proves the SQL is *called* correctly but
  # not that Postgres accepts it. The concurrency guarantee — "keep the better time" surviving
  # simultaneous writers — only means something against a real database.
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kangaroo
          POSTGRES_PASSWORD: kangaroo
          POSTGRES_DB: kangaroo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kangaroo -d kangaroo"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          KC_TEST_DATABASE_URL: postgres://kangaroo:kangaroo@127.0.0.1:5432/kangaroo

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Drives the real game: boot, session, screens, entering a match, and the credits screen
      # naming a CC-BY author. Zero console errors is a pass condition.
      - run: npm run check:smoke
      # Proves the PWA starts offline, which a headset launch depends on.
      - run: npm run check:pwa
